name: Compilar Canaima Engine
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargando Código
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Preparando Node.js
        uses: actions/setup-node@v4 # Actualizado a v4
        with:
          node-version: '14' # Versión un poco más moderna para evitar errores

      - name: Instalando Dependencias
        run: |
          cd newIDE/app
          npm install --legacy-peer-deps

      - name: Fabricando Canaima Engine 32bits
        run: |
          cd newIDE/app
          npm run dist:ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Entregar Motor Listo
        uses: actions/upload-artifact@v4 # ¡Esta es la corrección clave!
        with:
          name: Canaima-Engine-32bits
          path: newIDE/app/dist/*.exe
