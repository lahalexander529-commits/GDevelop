name: CanaimaBuild
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      - name: Limpiar y Preparar
        run: |
          cd newIDE/app
          npm install --legacy-peer-deps
      - name: Build
        run: |
          cd newIDE/app
          npx electron-builder --win --ia32 -c.win.target=portable -c.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: CanaimaEngine
          path: newIDE/app/dist/*.exe
